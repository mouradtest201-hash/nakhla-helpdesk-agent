# One command starts the whole stack:
#   docker compose up --build
#   agent API: http://localhost:8000/docs   helpdesk: http://localhost:8102/docs
#   (web UI: run `npm run dev` in web/, it proxies to the agent on :8000)
services:
  helpdesk-api:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8102:8102"
    environment:
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-dev-key-change-me}
      HELPDESK_TODAY: ${HELPDESK_TODAY:-}
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Inside compose the system of record is reached by service name.
      HELPDESK_API_URL: http://helpdesk-api:8102
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-dev-key-change-me}
      APP_DATA_DIR: /app/data
    volumes:
      - app-data:/app/data
    depends_on:
      helpdesk-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
