# One command starts the whole stack:
#   docker compose up --build
#   agent API: http://localhost:8000/docs   UI: http://localhost:7860   helpdesk: http://localhost:8102/docs
services:
  helpdesk-api:
    build:
      context: .
      dockerfile: services/Dockerfile
    ports:
      - "8102:8102"
    environment:
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-dev-key-change-me}
      HELPDESK_TODAY: ${HELPDESK_TODAY:-}
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Inside compose the system of record is reached by service name.
      HELPDESK_API_URL: http://helpdesk-api:8102
      HELPDESK_API_KEY: ${HELPDESK_API_KEY:-dev-key-change-me}
      APP_DATA_DIR: /app/data
    volumes:
      - app-data:/app/data
    depends_on:
      helpdesk-api:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "ui/app_ui.py"]
    ports:
      - "7860:7860"
    environment:
      APP_URL: http://app:8000
      UI_HOST: 0.0.0.0
      UI_PORT: 7860
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
